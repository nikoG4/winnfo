name: AppLocker enforcement experiment
on:
  push:
    branches: [ci/applocker-windows-lab-20261015]
    paths: ['.github/workflows/applocker-enforcement-experiment.yml']
permissions:
  contents: read
jobs:
  disposable-vm:
    name: Real enforcement on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test real AppLocker enforcement and rollback
        shell: powershell
        run: |
          & './experiments/applocker/Test-Strict.ps1' -Phase enforce
      - name: Upload report (if runner survived)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-real-enforce-${{ matrix.os }}
          path: experiments/applocker/strict-reports/
          if-no-files-found: warn
          retention-days: 7

